name: Generate AI Reports

on:
  schedule:
    # 北京时间 08:00 每日日报 / 08:30 每周六周报（UTC 00:00 / 00:30）
    - cron: "0 0 * * *"
    - cron: "30 0 * * 6"
  workflow_dispatch:
    inputs:
      kind:
        description: "daily 或 weekly"
        required: true
        default: "daily"
      dry_run:
        description: "只生成不发信（验证链路用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # 推送后触发部署（GITHUB_TOKEN 的推送不会自动触发其它工作流）

concurrency:
  group: generate-reports
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide kind
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            K="${{ github.event.inputs.kind }}"
          elif [ "${{ github.event.schedule }}" = "30 0 * * 6" ]; then
            K="weekly"
          else
            K="daily"
          fi
          echo "kind=$K" >> "$GITHUB_OUTPUT"

      - name: Generate report and send email
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          REPORT_TO_EMAIL: ${{ secrets.QQ_SMTP_TO }}
          REPORT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 scripts/ai_report/run.py "${{ steps.kind.outputs.kind }}"

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "murdo-report-bot"
          git config user.email "2640403264@qq.com"
          git add src/content/reports src/data/reports
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "no new report"
            exit 0
          fi
          git commit -m "report: ${{ steps.kind.outputs.kind }} $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送的提交不会触发 push 类工作流，显式派发一次部署
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
