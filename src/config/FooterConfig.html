<script data-goatcounter="https://murdo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
  // GoatCounter 访问统计显示（注册后把 murdo 换成你的子域名前缀）
  (function () {
    var CODE = "murdo";
    if (!CODE) return; // 未配置时静默
    function fill() {
      fetch("https://" + CODE + ".goatcounter.com/counter/TOTAL.json", { credentials: "omit" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) return;
          var pv = document.getElementById("busuanzi_value_site_pv");
          var uv = document.getElementById("busuanzi_value_site_uv");
          if (pv && d.count != null) pv.textContent = d.count;
          if (uv && d.count_unique != null) uv.textContent = d.count_unique;
        })
        .catch(function () {});
    }
    if (document.readyState === "complete") fill();
    else window.addEventListener("load", fill);
    document.addEventListener("swup:page:view", fill);
  })();
</script>
